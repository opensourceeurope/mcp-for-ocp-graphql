[project]
name = "mcp-for-ocp-graphql"
version = "0.0.1"
description = "MCP server for the Open Collective GraphQL API — read-only query proxy, schema lookup, and docs search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukasz Gornicki" }]
dependencies = [
  "mcp==1.27.2",
  "httpx>=0.27",
  "graphql-core==3.2.10",
  "pymilvus>=2.4",
  "milvus-lite>=2.4",
  "sentence-transformers>=3",
  "einops>=0.7",
  "uvicorn>=0.30",
]

[project.scripts]
mcp-for-ocp-graphql = "mcp_for_ocp_graphql.app_stdio:main"
mcp-for-ocp-graphql-http = "mcp_for_ocp_graphql.app_http:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_for_ocp_graphql"]
artifacts = [
  "mcp_for_ocp_graphql/data/schema.json",
  "mcp_for_ocp_graphql/data/milvus.db/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
