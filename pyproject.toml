[project]
name = "mcp-for-ocp-graphql"
version = "0.0.1"
description = "MCP server for the Open Collective GraphQL API — read-only query proxy, schema lookup, and docs search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukasz Gornicki" }]
dependencies = [
  "mcp==1.27.2",
  "httpx>=0.27",
  "graphql-core==3.2.10",
]

[project.scripts]
mcp-for-ocp-graphql = "mcp_for_ocp_graphql.app_stdio:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_for_ocp_graphql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
