[project]
name = "mcp-for-ocp-graphql"
version = "0.2.1"
description = "MCP server for the Open Collective GraphQL API — read-only query proxy, schema lookup, and docs search."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lukasz Gornicki" }]
# Doc search is pure-Python BM25 (mcp_for_ocp_graphql/search.py) over the baked
# docs.json — no PyTorch/embedding model/vector DB, so the runtime stays slim.
dependencies = [
  "mcp==1.27.2",
  "httpx>=0.27",
  "graphql-core==3.2.10",
  "uvicorn>=0.30",
]

[project.scripts]
mcp-for-ocp-graphql = "mcp_for_ocp_graphql.app_stdio:main"
mcp-for-ocp-graphql-http = "mcp_for_ocp_graphql.app_http:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_for_ocp_graphql"]
artifacts = [
  "mcp_for_ocp_graphql/data/schema.json",
  "mcp_for_ocp_graphql/data/docs.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# e2e tests hit the live OC API — opt in with `pytest -m e2e`.
addopts = "-m 'not e2e'"
markers = [
  "e2e: real end-to-end checks (live Open Collective API + baked docs corpus)",
]
