name: Publish mcp-for-ocp-graphql to PyPI

# PyPI trusted publishing (OIDC) — no token secrets. One-time setup on pypi.org:
# add a trusted publisher for project "mcp-for-ocp-graphql" -> this repo, workflow publish-pypi.yml.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.8.19"
          # No cache in a publishing workflow — a poisoned cache could taint the
          # released wheel (zizmor cache-poisoning). Publish runs rarely; skip it.
          enable-cache: false

      - name: Set version from the release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "PKG_VERSION=$VERSION" >> "$GITHUB_ENV"
          # write the version into pyproject (uvx with a pinned tool, no @latest)
          uvx --from "tomlkit==0.13.2" python - "$VERSION" <<'PY'
          import sys, tomlkit
          v = sys.argv[1]
          doc = tomlkit.parse(open("pyproject.toml").read())
          doc["project"]["version"] = v
          open("pyproject.toml","w").write(tomlkit.dumps(doc))
          print("set version", v)
          PY

      # The RAG/schema data is committed to the repo (refreshed by corpus-refresh.yml),
      # so the wheel packages it directly — no bake step here.
      - name: Build wheel + sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
