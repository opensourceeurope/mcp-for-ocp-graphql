name: Build and push to Scaleway

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: rg.pl-waw.scw.cloud
  IMAGE_NAME: opensourceeurope/opencollective-mcp
  SCW_REGION: pl-waw
  SCW_CLI_VERSION: 2.56.1

jobs:
  build-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # The RAG/schema data (mcp_for_ocp_graphql/data/, .opencrane/) is committed to
      # the repo and refreshed by corpus-refresh.yml — no bake step here; the image
      # just COPYs it (see Dockerfile).

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: github.ref == 'refs/heads/main' && vars.SCW_CONTAINER_ID != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Install scw CLI
        run: |
          curl -fsSL -o /tmp/scw \
            "https://github.com/scaleway/scaleway-cli/releases/download/v${SCW_CLI_VERSION}/scaleway-cli_${SCW_CLI_VERSION}_linux_amd64"
          chmod +x /tmp/scw
          sudo mv /tmp/scw /usr/local/bin/scw
          scw version

      - name: Update container to pinned image SHA
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
          CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          PUBLIC_URL: ${{ vars.SCW_PUBLIC_URL }}
        # Sizing is enforced here, not left to the container's manual config: doc search
        # is pure-Python BM25 over ~40 KB of JSON, so 512 MB / 0.28 vCPU is ample (the
        # old vector stack needed 2 GB just to load PyTorch + the embedding model). A
        # container created at Scaleway's 128 MB default crash-loops before this runs, so
        # the update also floors the limits.
        run: |
          scw container container update "$CONTAINER_ID" \
            image="$IMAGE" \
            memory-limit=512 \
            cpu-limit=280 \
            environment-variables.PUBLIC_URL="$PUBLIC_URL"
          scw container container deploy "$CONTAINER_ID"

      - name: Wait for the container to become ready
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
          CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
        # A green `container update` only means the API accepted the new image — it does
        # NOT mean the container booted. Poll status so a crash-looping deploy (e.g. an
        # OOM at startup) fails the job loudly instead of silently reporting success.
        run: |
          for i in $(seq 1 30); do
            status="$(scw container container get "$CONTAINER_ID" -o json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')"
            echo "attempt $i: status=$status"
            case "$status" in
              ready) echo "Container is ready."; exit 0 ;;
              error) echo "::error::Container is in error state — deploy failed."
                     scw container container get "$CONTAINER_ID" -o json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("error_message",""))'
                     exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Container did not become ready within the timeout."
          exit 1
